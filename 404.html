{% extends "base.html" %}

{% block content %}
<style>
    /* pic bg */
    .image-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
    }
    .image-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* pg info */
    .error-content {
        position: relative;
        z-index: 1;
        text-align: center;
        padding-top: 80px;
        color: white;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9);
    }
    .error-content h1 {
        font-size: 80px;
        color: white;
        margin-bottom: 10px;
    }
    .error-content p {
        font-size: 20px;
        margin-bottom: 8px;
    }
    .error-content a {
        color: #dceddc;
        font-size: 18px;
    }
</style>

<!-- ===== bg pic ===== -->
<div class="image-bg">
    <img src="{{ url_for('static', filename='images/404-bg.jpg') }}" alt="404 background">
</div>

<!-- ===== page ===== -->
<div class="error-content">
    <h1>🌿 404</h1>
    <p>Page Not Found</p>
    <p><a href="{{ url_for('home') }}">← Go back Home</a></p>
</div>
{% endblock %}
