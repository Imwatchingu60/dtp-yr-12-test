{% extends "base.html" %}

{% block content %}
<h1>All Flowers
    
</h1>
{% for flower in flowers %}
<div>
    <h2><a href="{{ url_for('flower_detail',id=flower['id']) }}">{{ flower['name'] }}</a></h2>
    <p><em>{{ flower['latin'] }}</em>
        &middot; {{flower['colour'] }}
        &middot; {{ flower['category'] }}
        &middot; blooms in {{ flower['season'] }}</p>
</div>
{% endfor %}

{% endblock %}
